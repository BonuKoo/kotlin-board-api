plugins {
	id 'java'
	// JSP 는 실행 가능한 jar 안에서 동작하지 않는다. war 패키징이 필요하다.
	id 'war'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.board'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 임시 DB
	implementation 'org.springframework.boot:spring-boot-h2console'
	//JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	//Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

	// JSP: Jasper 가 .jsp 를 서블릿으로 컴파일한다. JSTL 은 API 와 구현이 따로다.
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

	runtimeOnly 'com.h2database:h2'
	// 톰캣을 providedRuntime 으로 빼지 않는다.
	// Boot 4 는 spring-web 을 spring-boot-web-server(톰캣 스타터 하위)로 끌어오므로
	// 톰캣을 provided 로 돌리면 spring-web 까지 런타임에서 사라져 웹 컨텍스트가 뜨지 않는다.
	// 내장 톰캣으로 실행하는 구성이라 그대로 둔다.

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 한글 주석·문자열·테스트 이름이 깨지지 않도록 소스 인코딩을 못 박는다.
// Windows 의 JDK 17 은 플랫폼 기본(MS949)을 쓰므로 명시가 필요하다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'file.encoding', 'UTF-8'
}

tasks.named('bootRun') {
	jvmArgs '-Dfile.encoding=UTF-8'
}

// war 로 배포하므로 곁다리 plain jar 는 만들지 않는다.
tasks.named('jar') {
	enabled = false
}
